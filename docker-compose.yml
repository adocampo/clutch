# ┌──────────────────────────────────────────────────────────────────────┐
# │  Clutch — Video transcoding service                                 │
# │                                                                     │
# │  You do NOT need to edit this file. Copy `.env.example` to `.env`   │
# │  next to it and set the variables you care about:                   │
# │                                                                     │
# │      cp .env.example .env                                           │
# │      docker compose pull && docker compose up -d                    │
# │                                                                     │
# │  Every variable below has a sane default, so a missing `.env` still │
# │  works.                                                             │
# │                                                                     │
# │  Quick reference:                                                   │
# │    CLUTCH_IMAGE_VARIANT  clutch (default) | clutch-minimal          │
# │    CLUTCH_IMAGE_TAG      latest (default) | dev | 2.7.0             │
# │    CLUTCH_UPDATE_CHANNEL stable (default) | dev                     │
# │    CLUTCH_MEDIA_DIR      host directory mounted at /media           │
# └──────────────────────────────────────────────────────────────────────┘
services:
  clutch:
    # Full image (~1.5 GB, shell + in-place upgrades) or minimal (~280 MB).
    image: ghcr.io/adocampo/${CLUTCH_IMAGE_VARIANT:-clutch}:${CLUTCH_IMAGE_TAG:-latest}

    # ── Build from source instead of pulling from ghcr.io ─────────────
    # Comment out the "image:" line above and uncomment this block:
    # build:
    #   context: .
    #   #dockerfile: Dockerfile            # Full Arch image
    #   dockerfile: Dockerfile.minimal  # Scratch minimal image
    # image: clutch:latest

    container_name: clutch
    restart: unless-stopped
    ports:
      # Host port comes from CLUTCH_PORT; the container always listens on 8765.
      - "${CLUTCH_PORT:-8765}:8765"
    volumes:
      # Set CLUTCH_CONFIG_DIR to a host path to keep the config there instead
      # of in the named `clutch-config` volume.
      - ${CLUTCH_CONFIG_DIR:-clutch-config}:/config
      - ${CLUTCH_MEDIA_DIR:-/path/to/media}:${CLUTCH_MEDIA_MOUNT:-/media}
      # Mount extra host paths and list them in CLUTCH_ALLOW_ROOTS, e.g.:
      # - /NAS02:/NAS02
    environment:
      # ── Timezone (for log timestamps) ──
      - TZ=${TZ:-Europe/Madrid}
      # ── User mapping (run as non-root) ──
      - CLUTCH_UID=${CLUTCH_UID:-1000}
      - CLUTCH_GID=${CLUTCH_GID:-1000}
      # ── Workers ──
      - CLUTCH_WORKERS=${CLUTCH_WORKERS:-1}
      # ── Release channel for the in-dashboard updater (stable | dev).
      #    Keep it aligned with CLUTCH_IMAGE_TAG: dev image -> dev channel.
      #    Left empty, the entrypoint does not pass --update-channel at all. ──
      - CLUTCH_UPDATE_CHANNEL=${CLUTCH_UPDATE_CHANNEL:-}
      # ── Everything below is optional: an empty value means "use the
      #    built-in default", so leave it alone unless you need it. ──
      - CLUTCH_DEBUG=${CLUTCH_DEBUG:-}
      - CLUTCH_ALLOW_ROOTS=${CLUTCH_ALLOW_ROOTS:-}
      - CLUTCH_SERVICE_DB=${CLUTCH_SERVICE_DB:-}
      - CLUTCH_GPUS=${CLUTCH_GPUS:-}
      - CLUTCH_WATCH_DIRS=${CLUTCH_WATCH_DIRS:-}
      - CLUTCH_WATCH_RECURSIVE=${CLUTCH_WATCH_RECURSIVE:-}
      # Scheduling and electricity-price rules are configured in the dashboard
      # (Schedule page) and stored in the service database, so they are not
      # exposed here.

    # ── NVIDIA GPU passthrough (uncomment for hardware encoding) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  clutch-config:
