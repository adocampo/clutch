name: Build and push Docker images

# Publishing is tag-driven only: a version tag is what decides whether the
# build lands on `latest` (final release) or `dev` (prerelease). A manual
# dispatch has no version to derive tags from, so it is deliberately not
# offered.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # PEP 440 (not semver) so dev versions like 2.7.0.dev5 are valid tags.
          # `latest` comes from the version number, not from the branch: with
          # latest=auto, pep440 only marks final releases as latest, so a
          # prerelease/dev tag can never overwrite the stable image.
          flavor: |
            latest=auto
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            # Dev builds (tags like v2.7.0.dev5) also get a rolling `dev` tag.
            type=raw,value=dev,enable=${{ contains(github.ref_name, '.dev') }}

      - name: Build and push (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

  build-minimal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/clutch-minimal
          # PEP 440 (not semver) so dev versions like 2.7.0.dev5 are valid tags.
          # `latest` comes from the version number, not from the branch: with
          # latest=auto, pep440 only marks final releases as latest, so a
          # prerelease/dev tag can never overwrite the stable image.
          flavor: |
            latest=auto
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            # Dev builds (tags like v2.7.0.dev5) also get a rolling `dev` tag.
            type=raw,value=dev,enable=${{ contains(github.ref_name, '.dev') }}

      - name: Build and push (minimal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.minimal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=minimal
          cache-to: type=gha,mode=max,scope=minimal
